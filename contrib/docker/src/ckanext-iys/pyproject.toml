[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-iys"
version = "0.1.0"
description = "IYS site customisations that used to live on the iys_master branch of ckanext-cioos_theme"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."ckan.plugins"]
iys = "ckanext.iys.plugin:IysPlugin"

[tool.setuptools.packages.find]
include = ["ckanext*"]

[tool.setuptools.package-data]
"ckanext.iys" = [
    "templates/**/*.html",
    "public/*.css",
]
